spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:telemedicine_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        "[physical_naming_strategy]": org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        "[default_schema]": ${DB_SCHEMA:telemedicine_schema}
        "[format_sql]": true

  flyway:
    enabled: true
    locations: classpath:db/migration
    create-schemas: true
    init-sqls:
      - CREATE SCHEMA IF NOT EXISTS ${DB_SCHEMA:telemedicine_schema}
    schemas:
      - ${DB_SCHEMA:telemedicine_schema}
    default-schema: ${DB_SCHEMA:telemedicine_schema}
    table: flyway_schema_history_telemedicine
    baseline-on-migrate: true
    baseline-version: 0
    placeholders:
      db_schema: ${DB_SCHEMA:telemedicine_schema}

queue:
  block-users:
    fixed-delay-ms: 5000

server:
  port: 8081


cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}