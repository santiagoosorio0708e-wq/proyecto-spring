services:

  # ==========================================================
  # Workspace para Visual Studio Code
  # ========================================================== 
  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: intro_dev_workspace
    volumes:
      - .:/workspace:cached
    working_dir: /workspace
    command: sleep infinity
    depends_on:
      intro_postgres_db:
        condition: service_healthy
    networks:
      - intro_postgres_network

  # ==========================================================
  # PostgreSQL
  # ==========================================================
  intro_postgres_db:
    image: postgres:16
    container_name: intro_postgres_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - intro_postgres_data:/var/lib/postgresql/data
      # Si tienes scripts de inicio, puedes descomentar la siguiente linea:
      # - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - intro_postgres_network

  # ==========================================================
  # pgAdmin
  # ==========================================================
  intro_pgadmin_web:
    image: dpage/pgadmin4:latest
    container_name: intro_pgadmin_web
    depends_on:
      intro_postgres_db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - intro_pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    networks:
      - intro_postgres_network

volumes:
  intro_postgres_data:
  intro_pgadmin_data:

networks:
  intro_postgres_network:
    driver: bridge
